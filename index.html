<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desert Sniper</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #app { position: fixed; inset: 0; color: #fff; font: 16px sans-serif; }

      /* HUD: never intercepts the mouse (clicks go to the canvas). */
      .hud, .scope-overlay { position: fixed; inset: 0; pointer-events: none; user-select: none; }
      .hud { font: 600 14px/1.4 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
      .hud-panel { position: absolute; top: 14px; left: 16px; padding: 8px 12px; background: rgba(0, 0, 0, 0.35); border-radius: 6px; }
      .hud-wind-arrow { display: inline-block; }
      .hud-result { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; font-size: 28px; letter-spacing: 0.04em; }
      .hud-dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 2px #000; }
      /* At the very bottom, below the lens (the lens leaves >= 4% of the height there), so it never covers the reticle. */
      .hud-hint { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); max-width: 98vw; padding: 1px 12px;
        white-space: nowrap; text-align: center; font-size: clamp(10px, 1.3vw, 14px); line-height: 1.3;
        background: rgba(0, 0, 0, 0.35); border-radius: 6px; }
      /* The one clickable thing of the HUD: a link to the menu inside the hint, shown only while the mouse is free. */
      .hud-menu { pointer-events: auto; display: inline-block; margin-left: 12px; padding: 0 9px; color: #fff; text-decoration: none; cursor: pointer;
        background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 4px; }
      .hud-menu:hover, .hud-menu:focus-visible { background: rgba(255, 255, 255, 0.3); outline: none; }
      [hidden] { display: none !important; }

      /* "Preparing mission…" while the terrain and layout are built; the error panel when the game cannot start or stops. */
      .prep { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 600 14px/1.4 system-ui, sans-serif; letter-spacing: 0.04em; color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; user-select: none; }
      .fatal { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: 24px; box-sizing: border-box; text-align: center; background: rgba(0, 0, 0, 0.92);
        font: 600 15px/1.4 system-ui, sans-serif; color: #fff; }
      .fatal-text { margin: 0; max-width: 60ch; overflow-wrap: anywhere; }
      .fatal-link { padding: 8px 18px; color: #fff; text-decoration: none; cursor: pointer; font-size: 16px;
        background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; }
      .fatal-link:hover, .fatal-link:focus-visible { background: rgba(255, 255, 255, 0.24); outline: none; }

      /* Results: a dark translucent panel over the frozen scene. It takes the mouse (the HUD does not). */
      .results { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.45); font: 600 15px/1.4 system-ui, sans-serif; color: #fff; user-select: none; }
      .results-panel { min-width: 320px; padding: 22px 30px 24px; background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px; text-shadow: 0 1px 3px #000; }
      .results-title { margin: 0 0 14px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 0.06em; }
      .results-row { display: flex; justify-content: space-between; gap: 40px; padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
      .results-label { opacity: 0.8; }
      .results-value { font-variant-numeric: tabular-nums; }
      .results-buttons { display: flex; justify-content: center; gap: 14px; margin-top: 20px; }
      .results-button { min-width: 110px; padding: 8px 18px; font: inherit; font-size: 16px; color: #fff; cursor: pointer;
        background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; }
      .results-button:hover, .results-button:focus-visible { background: rgba(255, 255, 255, 0.24); outline: none; }

      /* Scope: black everywhere except a round lens; the reticle canvas is clipped to the lens. */
      .scope-overlay { z-index: 5; }
      .scope-lens { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%;
        box-shadow: 0 0 0 100vmax #000, inset 0 0 36px 8px rgba(0, 0, 0, 0.55); }
      .scope-reticle { position: absolute; left: 0; top: 0; }
      .hud { z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
